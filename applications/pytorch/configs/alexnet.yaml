model:
  name: alexnet
  num_classes: 10

dataset:
  name: mnist
  normalize: True
  max_test_samples: 1000

training:
  batch_size_train: 100
  batch_size_test: 1000
  num_workers_train: 4
  num_workers_test: 0
  pin_memory: false
  persistent_workers: false
  epochs: 10
  lr: 0.001

paths:
  dataset_root: datasets
  model_fp32: pytorch/models/alexnet/pretrained/alexnet_fp32.pth
  model_int8: pytorch/models/alexnet/pretrained/alexnet_int8.pth
  output_dir: pytorch/models/alexnet/pretrained/profiles

logging:
  level: INFO
  log_file: logs/alexnet.log

backend:
  name: tensor
  bitwidth: 8
  format: "float"
  backend_layers: ["conv2d", "linear"]

fault_injection:
  enabled: false
  mode: STUCK_AT_0            # STUCK_AT_0 | STUCK_AT_1 | BIT_FLIP
  target_nodes_range: [1500, 1531]  # o target_nodes: [n1, n2, ...]
  fault_cycle: 6              # solo para BIT_FLIP (rango: 1..tile_latency)
  sr_length: 1534
